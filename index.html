<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071522">
    <meta name="description" content="Plataforma 3D dedicado à Maísa, um jogo em desenvolvimento criado por João Lázaro com a engine ASFE.">
    <meta property="og:title" content="PLATAFORMA 3D DEDICADO A MAISA">
    <meta property="og:description" content="Uma aventura de plataforma 3D em construção, dedicada à Maísa.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://larslouch.github.io/ma/">
    <meta property="og:image" content="https://larslouch.github.io/ma/plataforma-3d-bahia-maisa.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PLATAFORMA 3D DEDICADO A MAISA">
    <meta name="twitter:description" content="Uma aventura de plataforma 3D em construção, dedicada à Maísa.">
    <meta name="twitter:image" content="https://larslouch.github.io/ma/plataforma-3d-bahia-maisa.png">
    <title>PLATAFORMA 3D DEDICADO A MAISA</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #071522;
        color: #f8fbff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: clamp(28px, 5vw, 72px) 18px 32px;
        background:
          radial-gradient(circle at 12% 12%, rgba(39, 203, 199, 0.16), transparent 30%),
          radial-gradient(circle at 88% 0%, rgba(94, 140, 255, 0.18), transparent 32%),
          linear-gradient(145deg, #071522 0%, #0b1d2e 48%, #07111d 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.18;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: linear-gradient(to bottom, #000, transparent 72%);
      }

      main {
        position: relative;
        width: min(1220px, 100%);
        margin: 0 auto;
      }

      header {
        max-width: 1040px;
        margin: 0 auto clamp(28px, 5vw, 52px);
        text-align: center;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 16px;
        color: #71e0da;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .tag::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #71e0da;
        box-shadow: 0 0 18px #71e0da;
        content: "";
      }

      h1 {
        margin: 0;
        font-size: clamp(2.45rem, 7.4vw, 6.35rem);
        line-height: 0.92;
        letter-spacing: -0.065em;
        text-wrap: balance;
      }

      h1 span {
        color: #9ff1df;
        text-shadow: 0 0 32px rgba(79, 218, 202, 0.14);
      }

      .intro {
        max-width: 590px;
        margin: 22px auto 0;
        color: #aebfd2;
        font-size: clamp(0.98rem, 2vw, 1.12rem);
        line-height: 1.65;
      }

      .gallery {
        padding: clamp(8px, 1vw, 12px);
        border: 1px solid rgba(178, 222, 255, 0.15);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.055);
        box-shadow: 0 34px 100px rgba(0, 0, 0, 0.44);
        backdrop-filter: blur(18px);
      }

      .gallery-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 230px;
        gap: 12px;
      }

      .stage {
        position: relative;
        min-width: 0;
        overflow: hidden;
        border-radius: 18px;
        background: #030b13;
      }

      .stage::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: inherit;
        content: "";
      }

      .stage img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        background: #030b13;
        transition: opacity 180ms ease, transform 420ms ease;
      }

      .stage:hover img { transform: scale(1.008); }

      .caption {
        position: absolute;
        z-index: 2;
        right: 14px;
        bottom: 14px;
        left: 14px;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        padding: 42px 14px 12px;
        border-radius: 13px;
        background: linear-gradient(to top, rgba(2, 10, 17, 0.88), transparent);
        pointer-events: none;
      }

      .caption strong {
        font-size: clamp(0.92rem, 2vw, 1.08rem);
        letter-spacing: -0.02em;
      }

      .counter {
        flex: none;
        color: #b7cadb;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.14em;
      }

      .nav-button {
        position: absolute;
        z-index: 3;
        top: 50%;
        width: 42px;
        height: 42px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        color: #fff;
        background: rgba(3, 13, 23, 0.72);
        font: inherit;
        font-size: 1.35rem;
        cursor: pointer;
        transform: translateY(-50%);
        transition: background 160ms ease, transform 160ms ease;
        backdrop-filter: blur(10px);
      }

      .nav-button:hover {
        background: rgba(35, 172, 171, 0.78);
        transform: translateY(-50%) scale(1.06);
      }

      .nav-button:focus-visible,
      .thumb:focus-visible {
        outline: 3px solid #9ff1df;
        outline-offset: 3px;
      }

      .previous { left: 16px; }
      .next { right: 16px; }

      .playlist {
        display: grid;
        align-content: start;
        gap: 10px;
      }

      .thumb {
        display: grid;
        gap: 9px;
        width: 100%;
        padding: 8px 8px 11px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        color: #dbe8f4;
        background: rgba(4, 15, 25, 0.72);
        text-align: left;
        cursor: pointer;
        transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
      }

      .thumb:hover {
        border-color: rgba(113, 224, 218, 0.46);
        transform: translateY(-2px);
      }

      .thumb[aria-pressed="true"] {
        border-color: #71e0da;
        background: rgba(30, 143, 145, 0.19);
        box-shadow: 0 0 0 1px rgba(113, 224, 218, 0.18) inset;
      }

      .thumb img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        border-radius: 10px;
        object-fit: cover;
        object-position: center top;
        background: #030b13;
      }

      .thumb span {
        padding: 0 3px;
        font-size: 0.82rem;
        font-weight: 750;
        line-height: 1.3;
      }

      footer {
        margin-top: 30px;
        color: #6f8498;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-align: center;
        text-transform: uppercase;
      }

      @media (max-width: 760px) {
        body { padding-inline: 12px; }
        .gallery-layout { grid-template-columns: 1fr; }
        .playlist { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .nav-button { width: 38px; height: 38px; }
        .previous { left: 10px; }
        .next { right: 10px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="tag">Plataforma 3D · Em desenvolvimento</div>
        <h1>PLATAFORMA 3D<br><span>DEDICADO A MAISA</span></h1>
        <p class="intro">Uma aventura de plataforma 3D criada com a ASFE por João Lázaro, como homenagem à Maísa.</p>
      </header>

      <section class="gallery" aria-label="Galeria de imagens do jogo">
        <div class="gallery-layout">
          <div class="stage">
            <img id="gallery-main" src="./plataforma-3d-bahia-maisa.png" alt="Personagem do jogo Plataforma 3D observando o cenário inspirado na Bahia" fetchpriority="high">
            <button class="nav-button previous" type="button" aria-label="Foto anterior">‹</button>
            <button class="nav-button next" type="button" aria-label="Próxima foto">›</button>
            <div class="caption" aria-live="polite">
              <strong id="gallery-caption">Mundo celeste inspirado na Bahia</strong>
              <span class="counter" id="gallery-counter">01 / 02</span>
            </div>
          </div>

          <div class="playlist" role="group" aria-label="Escolha uma foto">
            <button class="thumb" type="button" aria-pressed="true" data-src="./plataforma-3d-bahia-maisa.png" data-alt="Personagem do jogo Plataforma 3D observando o cenário inspirado na Bahia" data-caption="Mundo celeste inspirado na Bahia">
              <img src="./plataforma-3d-bahia-maisa.png" alt="" aria-hidden="true">
              <span>Cenário da Bahia</span>
            </button>

            <button class="thumb" type="button" aria-pressed="false" data-src="./pose-de-rainha.png" data-alt="Personagem do jogo em pose de rainha" data-caption="Pose de Rainha">
              <img src="./pose-de-rainha.png" alt="" aria-hidden="true" loading="lazy">
              <span>Pose de Rainha</span>
            </button>
          </div>
        </div>
      </section>

      <footer>Plataforma 3D · Feito com ASFE</footer>
    </main>

    <script>
      const mainImage = document.querySelector("#gallery-main");
      const caption = document.querySelector("#gallery-caption");
      const counter = document.querySelector("#gallery-counter");
      const thumbnails = [...document.querySelectorAll(".thumb")];
      let currentIndex = 0;

      function showImage(index) {
        currentIndex = (index + thumbnails.length) % thumbnails.length;
        const selected = thumbnails[currentIndex];

        mainImage.style.opacity = "0";
        window.setTimeout(() => {
          mainImage.src = selected.dataset.src;
          mainImage.alt = selected.dataset.alt;
          caption.textContent = selected.dataset.caption;
          counter.textContent = `${String(currentIndex + 1).padStart(2, "0")} / ${String(thumbnails.length).padStart(2, "0")}`;
          mainImage.style.opacity = "1";
        }, 100);

        thumbnails.forEach((thumbnail, thumbnailIndex) => {
          thumbnail.setAttribute("aria-pressed", String(thumbnailIndex === currentIndex));
        });
      }

      thumbnails.forEach((thumbnail, index) => {
        thumbnail.addEventListener("click", () => showImage(index));
      });

      document.querySelector(".previous").addEventListener("click", () => showImage(currentIndex - 1));
      document.querySelector(".next").addEventListener("click", () => showImage(currentIndex + 1));
    </script>
  </body>
</html>
