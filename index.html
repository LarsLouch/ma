<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080c18">
    <meta name="description" content="Demonstração em vídeo do Run3D, um jogo de plataforma 3D feito na MinhaEngine.">
    <meta property="og:title" content="Run3D — Gameplay">
    <meta property="og:description" content="Veja uma demonstração do jogo de plataforma 3D feito na MinhaEngine.">
    <meta property="og:type" content="website">
    <title>Run3D — Gameplay</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080c18;
        color: #f7f8ff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        background:
          radial-gradient(circle at 50% 0%, rgba(40, 143, 255, 0.22), transparent 38%),
          linear-gradient(145deg, #080c18 0%, #10182d 100%);
      }

      main {
        width: min(1080px, 100%);
        text-align: center;
      }

      .tag {
        margin: 0 0 10px;
        color: #7cc7ff;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 7vw, 5rem);
        line-height: 1;
        letter-spacing: -0.05em;
      }

      p {
        max-width: 640px;
        margin: 18px auto 28px;
        color: #b8c2dc;
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.6;
      }

      .player {
        overflow: hidden;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
      }

      video {
        display: block;
        width: 100%;
        max-height: 76vh;
        border-radius: 13px;
        background: #000;
      }

      footer {
        margin-top: 22px;
        color: #6f7b99;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tag">MinhaEngine apresenta</div>
      <h1>Run3D</h1>
      <p>Uma demonstração do nosso jogo de plataforma 3D. Dê o play e veja o projeto em funcionamento.</p>
      <div class="player">
        <video controls playsinline preload="metadata">
          <source src="./2026-08-22%2011-48-47.mp4" type="video/mp4">
          Seu navegador não consegue reproduzir este vídeo.
        </video>
      </div>
      <footer>Run3D · Feito com MinhaEngine</footer>
    </main>
  </body>
</html>
